<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Video...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    video {
      max-width: 100%;
      max-height: 100vh;
      outline: none;
    }
    .error {
      color: #ff5555;
      font-size: 1.2rem;
    }
    /* Subtle hint for user to unmute */
    .unmute-hint {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="container">
    <p id="status">Loading video...</p>
  </div>

  <script>
    const GITHUB_USERNAME = "YOUR_USERNAME";
    const REPO_NAME = "YOUR_REPO";

    function playVideo() {
      // Extract video number from URL path (e.g. /v/42 -> 42)
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const videoId = pathSegments[pathSegments.length - 1];

      const num = parseInt(videoId, 10);
      if (isNaN(num) || num < 1 || num > 100) {
        document.getElementById('status').innerHTML = `<span class="error">Invalid video selection: ${videoId}</span>`;
        return;
      }

      const videoFileName = `video${num}.mp4`;
      const videoSrc = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/videos/${videoFileName}`;

      const container = document.getElementById('container');
      
      // Muted attribute added directly to the video tag
      container.innerHTML = `
        <div class="unmute-hint">🔊 Tap video to unmute</div>
        <video id="player" controls autoplay muted playsinline>
          <source src="${videoSrc}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      `;

      const player = document.getElementById('player');
      
      // Ensure autoplay triggers instantly
      player.play().catch(error => {
        console.log("Autoplay failed:", error);
      });
    }

    playVideo();
  </script>
</body>
</html>
